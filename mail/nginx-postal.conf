# The Postal dashboard behind the VPS's nginx. Copy to
# /etc/nginx/sites-available/postal.conf with MAIL_DOMAIN replaced (README step
# 3); certbot --nginx adds the TLS block and the redirect from port 80.
server {
    listen 80;
    server_name postal.MAIL_DOMAIN;

    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
