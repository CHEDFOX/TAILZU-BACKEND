# Postal, the mail platform. Lives at /opt/postal on the VPS (setup.sh copies it
# there with the config it fills in). Four Postal processes share one image and
# one config; MariaDB holds the main database and one database per mail server.
#
#   docker compose up -d                  start / apply changes
#   docker compose logs -f smtp worker    watch deliveries
#   docker compose run --rm runner postal make-user     another dashboard login
#
# Ports: 25 is SMTP (receives bounces, and submission with STARTTLS); 587 is the
# same listener for apps whose networks block 25. The dashboard is on
# 127.0.0.1:5000, behind the VPS's nginx (nginx-postal.conf).

x-postal: &postal
  image: ${POSTAL_IMAGE:-ghcr.io/postalserver/postal:3.3.4}
  env_file: .env
  volumes:
    - /opt/postal/config:/config
  depends_on:
    mariadb:
      condition: service_healthy
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: postal
      MARIADB_USER: postal
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postal_db:/var/lib/mysql
      # Postal makes a database per mail server (postal-<id>): the grant for that.
      - ./mariadb-init.sql:/docker-entrypoint-initdb.d/10-postal-grants.sql:ro
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--max-connections=400"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    <<: *postal
    command: postal web-server
    ports:
      - "127.0.0.1:5000:5000"

  smtp:
    <<: *postal
    command: postal smtp-server
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "25:25"
      - "587:25"

  worker:
    <<: *postal
    command: postal worker

  cron:
    <<: *postal
    command: postal cron

  # One-off commands only: `docker compose run --rm runner postal <command>`.
  runner:
    <<: *postal
    profiles: ["tools"]
    command: postal

volumes:
  postal_db:
