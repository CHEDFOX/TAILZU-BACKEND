<!-- Supabase -> Authentication -> Email Templates -> CONFIRM SIGNUP
     Sent when the address is NEW to the project. Keep byte-identical to
     magic-link.html apart from this comment: the user asked for a code and
     does not care which of GoTrue's paths answered. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <!-- The palette is a choice, not a light theme. Without these, Gmail and
         Outlook "helpfully" invert it and the amber becomes a blue-grey. -->
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>Your Tailzu code</title>
  </head>
  <!-- Every colour is restated on the element. Inherited colour is the first
       thing a client's dark-mode pass throws away. -->
  <body style="margin:0;padding:0;background-color:#E8A23C;">
    <!-- Preheader: the grey line the inbox shows next to the subject. Hidden in
         the mail itself by zero size, which is the only trick that works
         everywhere. Without it the client picks the first visible words, and
         that is the word "TAILZU" on its own. -->
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#E8A23C;font-size:1px;line-height:1px;">
      Your six-digit code is {{ .Token }} — it expires in an hour.
    </div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
           style="background-color:#E8A23C;margin:0;padding:0;">
      <tr>
        <td align="center" style="padding:44px 20px;">

          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                 style="max-width:420px;width:100%;">

            <!-- THE ICON, AND THE WORD UNDER IT.
                 Both, because most clients block remote images until the reader
                 allows them, and a mail whose only identification is a broken
                 image tile is a mail that looks like phishing at the exact
                 moment it is asking for trust. The word carries the identity;
                 the icon is what makes it feel like the app.

                 The src is keyed, not content-addressed. This HTML is pasted
                 into Supabase by hand and then sits for months, so a hash in it
                 would break the day anyone re-uploads the icon — see the
                 /media/k/:key route. Upload to `email.mark` and this follows. -->
            <tr>
              <td style="padding:0 0 14px 2px;">
                <img src="https://api.tailzu.space/media/k/email.mark"
                     width="40" height="40" alt=""
                     style="display:block;width:40px;height:40px;border:0;outline:none;border-radius:9px;background-color:#0B0B0D;">
              </td>
            </tr>

            <!-- Eyebrow. Small, tracked, uppercase — the same line the Stats
                 screen opens with, and for the same reason: it names the thing
                 without competing with the number underneath it. -->
            <tr>
              <td style="padding:0 4px 2px 4px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#5F441F;">
                Tailzu
              </td>
            </tr>

            <!-- THE CODE IS THE HERO NUMBER. Same role the month's word count
                 plays on Stats: one figure, oversized, in the ink colour, with
                 everything else stepped down around it. Tracking is positive
                 here where the Stats figure is negative — digits that will be
                 read back one at a time need air between them, which is the
                 opposite of what a number read as a quantity wants. -->
            <tr>
              <td style="padding:6px 2px 0 2px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:52px;line-height:58px;font-weight:800;letter-spacing:8px;color:#0B0B0D;">
                {{ .Token }}
              </td>
            </tr>

            <tr>
              <td style="padding:10px 4px 0 4px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:19px;color:#5F441F;">
                Type this into the app to sign in.
              </td>
            </tr>

            <!-- The black card. One, not three: this email has one fact worth
                 setting apart, and a grid of cards on a page with a single
                 number is decoration pretending to be structure. -->
            <tr>
              <td style="padding:22px 0 0 0;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                       style="background-color:#0B0B0D;border-radius:13px;">
                  <tr>
                    <td style="padding:15px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;color:#AA782F;">
                      The code expires in an hour and works once.
                      <span style="color:#855E27;">Didn&rsquo;t ask for it? Nothing has happened to your account &mdash; ignore this.</span>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td style="padding:26px 4px 0 4px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px;line-height:16px;color:#8B6328;">
                Sent because someone asked to sign in to Tailzu with this address.
              </td>
            </tr>

          </table>

        </td>
      </tr>
    </table>
  </body>
</html>
