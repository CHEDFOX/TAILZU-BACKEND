<!-- Supabase -> Authentication -> Email Templates -> MAGIC LINK
     Sent when the address ALREADY has an account. Keep byte-identical to
     confirm-signup.html apart from this comment: the user asked for a code and
     does not care which of GoTrue's paths answered. -->
<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office" style="margin:0;padding:0;height:100%;background-color:#EFEDE8;">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="format-detection" content="telephone=no,date=no,address=no,email=no,url=no">
    <!-- Light by design, as the sign-in screen is. Saying "light" and nothing
         else tells Apple Mail and Outlook the palette is handled, so they
         leave it alone instead of repainting it. -->
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>Your X0 Bot code</title>
    <!-- The app's two faces on this screen: Bricolage Grotesque, which draws
         the heading and the code boxes' digits (PHONE_FONT.grotesk, cut to
         800), and Instrument Sans for the small print (PHONE_FONT.ui). Apple
         Mail, iOS Mail, Samsung and Outlook for Mac load them; Gmail and
         Outlook on Windows do not, and each stack ends in a system face. -->
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
    <!--[if gte mso 9]><xml><o:OfficeDocumentSettings><o:AllowPNG/><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml><![endif]-->
    <style>
      :root { color-scheme: light; supported-color-schemes: light; }
      html, body { margin: 0 !important; padding: 0 !important; width: 100% !important; height: 100% !important; background-color: #EFEDE8 !important; }
      * { -ms-text-size-adjust: 100%; -webkit-text-size-adjust: 100%; }
      table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
      a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; }
      /* Outlook.com's dark mode repaints by these attributes: keep the drawing. */
      [data-ogsb] .tz-ground { background-color: #EFEDE8 !important; }
      [data-ogsb] .tz-box { background-color: #FFFFFF !important; }
      [data-ogsb] .tz-ring { background-color: #CBF1BE !important; }
      [data-ogsc] .tz-ink { color: #1C1A17 !important; }
      [data-ogsc] .tz-ink2 { color: #5B5956 !important; }
      [data-ogsc] .tz-muted { color: #797773 !important; }
      @media (min-width: 601px) { .tz-floor { height: 1240px !important; } }
      @media (min-width: 1600px) { .tz-floor { height: 1500px !important; } }
      @media (max-width: 480px) {
        .tz-pad { padding-left: 20px !important; padding-right: 20px !important; padding-top: 40px !important; }
        .tz-code { font-size: 38px !important; line-height: 46px !important; letter-spacing: 8px !important; }
      }
    </style>
  </head>
  <!-- The ground is painted five times over, because each client honours a
       different one: the html and body (Apple Mail, iOS Mail, and the overscroll
       above and below the mail), the bgcolor attributes (Gmail, which drops
       the body's style), the full-width, full-height wrapper (everything else),
       and VML for Outlook on Windows, whose Word engine paints only that.
       Every colour is also restated on its element: inherited colour is the
       first thing a client's dark-mode pass throws away. -->
  <body class="tz-ground" bgcolor="#EFEDE8" style="margin:0;padding:0;width:100%;height:100%;background-color:#EFEDE8;">
    <!--[if gte mso 9]><v:background xmlns:v="urn:schemas-microsoft-com:vml" fill="t"><v:fill type="tile" color="#EFEDE8"/></v:background><![endif]-->

    <!-- Preheader: the grey line the inbox shows beside the subject. The run of
         zero-width characters after it stops the client filling the rest of
         that line with the first words of the mail. -->
    <div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;color:#EFEDE8;">
      Your X0 Bot code is {{ .Token }}
      &#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;
    </div>

    <!-- AT LEAST A SCREEN TALL, ON EVERY SCREEN. Two holds, so that losing one
         never shows white:
         - the block: 100vh, in a div because a minimum height is ignored on
           tables and their cells. Most clients know viewport units, and in a
           webmail 100vh is the browser's window, taller than the pane the
           mail sits in, so the first screen is always covered;
         - the cell's height, for the clients that do not know viewport units
           or resolve them to nothing: 960 px, raised by width in the style
           block (1240 from tablet width, 1500 from wide desktops), since a
           taller screen is a wider one.
         Whatever the content does not fill stays ground. -->
    <div class="tz-ground" style="margin:0;padding:0;width:100%;min-height:100vh;background-color:#EFEDE8;">
    <table role="presentation" class="tz-ground" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#EFEDE8"
           style="width:100%;background-color:#EFEDE8;border-collapse:collapse;margin:0;padding:0;">
      <tr>
        <td class="tz-ground tz-floor" align="center" valign="top" height="960" bgcolor="#EFEDE8" style="background-color:#EFEDE8;padding:0;">

          <!--[if mso]><table role="presentation" width="480" align="center" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;width:100%;margin:0 auto;">
            <tr>
              <td class="tz-pad" align="left" style="padding:56px 32px 72px 32px;">

                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">

                  <!-- THE ICON, alone: the app icon, rounded as a launcher
                       rounds it, so the mail is recognisably from the thing on
                       their home screen. 224 px of art in a 56 px slot, which
                       is what the halftone needs to stay dots on a retina
                       screen. The alt text names it for the clients that block
                       remote images until the reader allows them: they draw
                       "X0 Bot" in its place, in the face and ink set below.
                       The src is keyed by name, not by content hash: the
                       backend serves the icon it ships with, or whatever is
                       uploaded under `email.icon` (see _README.md). -->
                  <tr>
                    <td style="padding:0;">
                      <img src="https://api.tailzu.space/media/k/email.icon" width="56" height="56" alt="X0 Bot"
                           style="display:block;width:56px;height:56px;border:0;outline:none;text-decoration:none;border-radius:13px;background-color:#EFEDE8;font-family:'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px;line-height:56px;text-align:center;color:#1C1A17;">
                    </td>
                  </tr>

                  <tr><td style="height:40px;line-height:40px;font-size:1px;">&nbsp;</td></tr>

                  <!-- The same sentence the code screen says, in the same face
                       at the same size, so the mail and the screen read as one
                       thing rather than two. -->
                  <tr>
                    <td class="tz-ink" style="padding:0;font-family:'Bricolage Grotesque',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:26px;line-height:32px;font-weight:800;letter-spacing:-0.6px;color:#1C1A17;">
                      Enter the code I sent.
                    </td>
                  </tr>

                  <tr><td style="height:28px;line-height:28px;font-size:1px;">&nbsp;</td></tr>

                  <!-- THE CODE, drawn as its box is drawn on the screen: the
                       neon ring, then white, then the ink edge, then the digits
                       in the heading's face. Neon is the app's one live colour
                       and for the next hour this is what is live.

                       One box around the whole code, never one per digit: a
                       copied code must paste as the code, and iOS only offers
                       it from Mail when it can read it as one run. The letter
                       spacing is what separates the digits instead.

                       Nested tables rather than two borders, because Outlook's
                       Word engine draws padding on a cell and nothing else. -->
                  <tr>
                    <td style="padding:0;">
                      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:separate;">
                        <tr>
                          <td class="tz-ring" bgcolor="#CBF1BE" style="padding:5px;background-color:#CBF1BE;border-radius:19px;">
                            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:separate;">
                              <tr>
                                <td class="tz-box tz-code tz-ink" bgcolor="#FFFFFF" align="center"
                                    style="padding:14px 26px 16px 32px;background-color:#FFFFFF;border:1.5px solid #1C1A17;border-radius:14px;font-family:'Bricolage Grotesque',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:44px;line-height:52px;font-weight:800;letter-spacing:10px;color:#1C1A17;mso-line-height-rule:exactly;">
                                  {{ .Token }}
                                </td>
                              </tr>
                            </table>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>

                  <tr>
                    <td class="tz-muted" style="padding:16px 0 0 3px;font-family:'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px;line-height:15px;letter-spacing:1.5px;text-transform:uppercase;color:#797773;">
                      Sign-in code &middot; one hour
                    </td>
                  </tr>

                  <tr><td style="height:72px;line-height:72px;font-size:1px;">&nbsp;</td></tr>

                  <tr>
                    <td style="padding:0;">
                      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                        <tr><td height="1" bgcolor="#D4D2CD" style="height:1px;line-height:1px;font-size:1px;background-color:#D4D2CD;">&nbsp;</td></tr>
                      </table>
                    </td>
                  </tr>
                  <tr>
                    <td class="tz-ink2" style="padding:18px 0 0 0;font-family:'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:19px;color:#5B5956;">
                      Didn&rsquo;t ask for it? Ignore this.
                    </td>
                  </tr>

                </table>

              </td>
            </tr>
          </table>
          <!--[if mso]></td></tr></table><![endif]-->

        </td>
      </tr>
    </table>
    </div>
  </body>
</html>
