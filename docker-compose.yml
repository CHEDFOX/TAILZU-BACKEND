# Tulmi — one-command deploy. SAFE FOR A SHARED VPS:
# by default it binds to localhost only on an uncommon port and does NOT touch
# ports 80/443, so it cannot collide with your other apps.
#
#   Start (localhost only):   docker compose up -d --build
#   Quick public test:        FLOW_BIND=0.0.0.0 docker compose up -d --build
#                             (reach it at http://YOUR_VPS_IP:8770)
#   Own HTTPS proxy (only if 80/443 are FREE):
#                             docker compose --profile https up -d --build
#                             (its hostnames are in deploy/Caddyfile: api. and app. on x0bot.com and tailzu.space)
#
# Tunables (set in your shell or in tulmi/.env):
#   FLOW_BIND    - host interface to bind (default 127.0.0.1 = localhost only)
#   FLOW_PORT    - host port (default 8770; change if 8770 is taken)
#
# Keys come from tulmi/.env (never commit it). See ../.env.example (canonical).

services:
  backend:
    build:
      context: .
      dockerfile: tulmi/Dockerfile
      # The build runs the new database migrations first (the Dockerfile's migrate stage, tulmi/supabase/migrate-pending.sh), before the
      # running container is touched: a failed one stops the build and the server keeps serving. It reads SUPABASE_DB_URL from tulmi/.env,
      # given as a build secret (never kept in the image), as the nightly backup does.
      args:
        DEPLOY_MIGRATIONS: "1"
      secrets:
        - app_env
    env_file:
      - tulmi/.env
    environment:
      HOST: 0.0.0.0 # inside the container; harmless
      PORT: 8080 # container-internal port
      NODE_ENV: production
      MEDIA_DIR: /data/media
      # The control plane's live rules and their history (GET /admin).
      CONTROL_DIR: /data/control
      # Each Xode project's code, kept for the chat to search all of it (tulmi/src/code/project/copies.ts).
      CODE_COPY_DIR: /data/code
      # Public URL clients see for uploaded media. Empty: the server's own
      # PUBLIC_ORIGIN + /media (tulmi/.env), so it moves when that does.
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-}
    # Host-side binding. Default 127.0.0.1:8770 => private to this VPS, no
    # public exposure, no chance of clashing with 80/443 or other backends.
    ports:
      - "${FLOW_BIND:-127.0.0.1}:${FLOW_PORT:-8770}:8080"
    # Persist uploaded media across container recreation. `tulmi_media` is a
    # named docker volume; contents survive `docker compose down/up`.
    volumes:
      - tulmi_media:/data/media
      # Control-plane rules survive every deploy, like the media.
      - tulmi_control:/data/control
      # The projects' code copies: rebuilt from GitHub if lost, kept across deploys so they need not be.
      - tulmi_code:/data/code
      # Desktop-app installers, served at /downloads/* (see the /download page).
      # Host-side bind mount so publishing a release is just:
      #   scp "Tailzu-Setup.exe" server:~/tulmi/downloads/
      - ./downloads:/data/downloads
      # The landing page, served at /. Same shape as the installers:
      #   scp index.html server:~/tulmi/site/
      - ./site:/data/site
    restart: unless-stopped
    # Docker uses the image's HEALTHCHECK directive by default; restate it here
    # so a misconfigured base image can't silently disable liveness probing.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # The default network (out to the internet, and the port above) and the media network, where the media worker is (below). In tulmi/.env:
    # MEDIA_WORKER_URL=http://media-worker:8000
    networks:
      - default
      - media

  # THE MEDIA WORKER (media-worker/, docs/media.md, DEPLOY.md): reads office files (MarkItDown), scanned and complex PDFs (Docling), shrinks pictures
  # (Pillow) and cuts videos into key frames and a sound track (ffmpeg) for the backend. OPTIONAL: it only starts with the `media` profile,
  #
  #   MEDIA_WORKER_SECRET=$(openssl rand -hex 32) docker compose --profile media up -d --build
  #
  # (put the same secret in tulmi/.env as MEDIA_WORKER_SECRET; compose reads its own copy from a `.env` beside this file or from the shell).
  # It is held to what it needs: no network out (the `media` network is internal: only the backend can reach it), a read-only filesystem with a
  # scratch space, no capabilities, a memory and process limit, and a user that is not root. Its jobs run in children with their own clock and
  # memory limit, and without the secret.
  media-worker:
    profiles: ["media"]
    build:
      context: ./media-worker
    image: tailzu-media-worker
    environment:
      MEDIA_WORKER_SECRET: ${MEDIA_WORKER_SECRET:-}
      WORKER_CONCURRENCY: ${MEDIA_WORKER_CONCURRENCY:-2}
    networks:
      - media
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${MEDIA_WORKER_MEMORY:-6g}
    cpus: ${MEDIA_WORKER_CPUS:-2}
    pids_limit: 512
    restart: unless-stopped

  # THE ORACLE WORKER (oracle-worker/, docs/oracle.md, DEPLOY.md): Plutto's oracle for the Oracle bot. OPTIONAL: it only starts with the `oracle` profile,
  #
  #   ./deploy/oracle-up.sh      (once: it makes ORACLE_WORKER_SECRET and sets ORACLE_WORKER_URL in tulmi/.env; then ship.sh keeps it up to date)
  #
  # It reads tulmi/.env, like the backend. The engine is the owner's own Plutto, and the worker drops the database, Supabase, payment and push
  # names before the engine loads (oracle-worker/server/config.py), so its memory never touches the server's database. Unlike the media worker
  # it needs the internet (the models), so it is on the default network, but it has no port on the host and answers only a signed request.
  # Read-only, no capabilities, not root; what it writes is scratch in /tmp, gone with the container: nothing a person asked is kept there.
  oracle-worker:
    profiles: ["oracle"]
    build:
      context: ./oracle-worker
    image: tailzu-oracle-worker
    env_file:
      - tulmi/.env
    environment:
      ORACLE_PROFILE: bot
      ORACLE_WORKER_CONCURRENCY: ${ORACLE_WORKER_CONCURRENCY:-8}
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${ORACLE_WORKER_MEMORY:-1g}
    cpus: ${ORACLE_WORKER_CPUS:-1}
    pids_limit: 256
    restart: unless-stopped

  # THE MAIL WORKER (mail-worker/, docs/mail.md, DEPLOY.md): the mail bot's engine, copied from Xooteq Mail and tuned for any business.
  # OPTIONAL: it only starts with the `mail` profile,
  #
  #   ./deploy/mail-up.sh      (once: it takes the mail server's values into tulmi/.env, makes the worker's secrets, starts it and
  #                             registers its new-mail webhook; then ship.sh keeps it up to date)
  #
  # The mailboxes are on the mail server Xooteq Mail runs on this VPS (Stalwart owns port 25, and only one program can): the worker joins
  # its Docker network (MAIL_STALWART_NETWORK, postal_default by default) as x0-mail-worker, and reaches it as http://stalwart:8080. Its
  # own records (businesses, briefs, the AI log) are in the mail_worker_data volume. It reads tulmi/.env, like the backend. No port on the
  # host: only the backend (signed calls) and the mail server (its signed webhook) reach it. Read-only, no capabilities, not root.
  mail-worker:
    profiles: ["mail"]
    build:
      context: ./mail-worker
    image: tailzu-mail-worker
    env_file:
      - tulmi/.env
    environment:
      DATA_DIR: /data
    volumes:
      - mail_worker_data:/data
    networks:
      default: {}
      stalwart:
        aliases: [x0-mail-worker]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${MAIL_WORKER_MEMORY:-512m}
    cpus: ${MAIL_WORKER_CPUS:-1}
    pids_limit: 256
    restart: unless-stopped

  # OPTIONAL reverse proxy with automatic HTTPS. It claims ports 80 and 443, so
  # ONLY use this if nothing else on the VPS is using them. If you already run
  # nginx/Apache/Caddy for your other apps, DON'T enable this — instead add a
  # subdomain to that existing proxy pointing at 127.0.0.1:8770 (see DEPLOY.md).
  # It never starts on a plain `docker compose up` (profile-gated).
  caddy:
    image: caddy:2
    profiles: ["https"]
    depends_on:
      backend:
        condition: service_healthy
    # The hostnames are written in deploy/Caddyfile (api. and app. on x0bot.com
    # and on tailzu.space, docs/domain-x0bot.md); nothing to pass in.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

networks:
  # Only the backend and the media worker are on it, and it has no route out: a file cannot make the worker call anything.
  media:
    internal: true
  # The mail server's own network (Xooteq Mail's compose project in /opt/postal), joined only by the mail worker, only when it runs.
  stalwart:
    external: true
    name: ${MAIL_STALWART_NETWORK:-postal_default}

volumes:
  caddy_data:
  caddy_config:
  # The mail worker's records: the businesses, their briefs and addresses' modes, and the AI log (the mail itself is on the mail server).
  mail_worker_data:
  # Media store for admin-uploaded assets (icons, brand marks, splash images,
  # audio, video, SVGs). Files live under /data/media inside the container;
  # this named volume keeps them across `docker compose up -d --build`.
  tulmi_media:
  # Live rules edited from the console at /admin, with every saved version.
  tulmi_control:
  # Xode's copy of each project's code (one gzipped file a project; swept after 30 days unused).
  tulmi_code:

# tulmi/.env for the image build's migrate stage only (backend.build.secrets above): mounted for that one step, never in the image.
secrets:
  app_env:
    file: ./tulmi/.env
