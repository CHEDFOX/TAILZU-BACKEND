name: CI

on:
  push:
    # claude/** included: production deploys pull feature branches directly
    # (see LAUNCH.md), so they must be CI-gated too — main-only left the
    # deployed branch entirely unchecked.
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch — keep CI fast.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tulmi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tulmi/package-lock.json

      - name: Install (frozen)
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # The Cloudflare jobs Worker (jobs/): it bundles ../tulmi/src, so tulmi's dependencies are installed too.
  jobs-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            tulmi/package-lock.json
            jobs/package-lock.json

      - name: Install tulmi (the Worker imports its source)
        run: npm ci --no-audit --no-fund
        working-directory: tulmi

      - name: Install jobs (frozen)
        run: npm ci --no-audit --no-fund
        working-directory: jobs

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: jobs

      - name: Test (workerd, offline)
        run: npx vitest run
        working-directory: jobs

      - name: Bundle (dry run)
        run: npx wrangler deploy --dry-run --outdir dist
        working-directory: jobs

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tulmi/Dockerfile
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
