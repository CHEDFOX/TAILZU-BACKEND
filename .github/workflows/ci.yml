name: CI

on:
  push:
    # claude/** included: production deploys pull feature branches directly
    # (see LAUNCH.md), so they must be CI-gated too — main-only left the
    # deployed branch entirely unchecked.
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch — keep CI fast.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tulmi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tulmi/package-lock.json

      - name: Install (frozen)
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # The Cloudflare jobs Worker (jobs/): it bundles ../tulmi/src, so tulmi's dependencies are installed too.
  jobs-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            tulmi/package-lock.json
            jobs/package-lock.json

      - name: Install tulmi (the Worker imports its source)
        run: npm ci --no-audit --no-fund
        working-directory: tulmi

      - name: Install jobs (frozen)
        run: npm ci --no-audit --no-fund
        working-directory: jobs

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: jobs

      - name: Test (workerd, offline)
        run: npx vitest run
        working-directory: jobs

      - name: Bundle (dry run)
        run: npx wrangler deploy --dry-run --outdir dist
        working-directory: jobs

  # The artifact viewer Worker (viewer/). Its vendored libraries (~8 MB) are not committed: `npm run build` fetches the pinned packages from
  # npm (viewer/vendor-src/package-lock.json) and bundles them; `--verify` checks the result against viewer/vendor.lock.json.
  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            viewer/package-lock.json
            viewer/vendor-src/package-lock.json

      - name: Install (frozen)
        run: npm ci --no-audit --no-fund
        working-directory: viewer

      - name: Vendor the libraries and build the runtime
        run: npm run build
        working-directory: viewer

      - name: Vendored files match the lock
        run: npm run vendor -- --verify
        working-directory: viewer

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: viewer

      - name: Unit and workerd tests
        run: npx vitest run
        working-directory: viewer

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: viewer

      - name: End to end (Chromium against wrangler dev)
        run: npx playwright test
        working-directory: viewer

      - name: Bundle (dry run)
        run: npx wrangler deploy --dry-run --outdir dist
        working-directory: viewer

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tulmi/Dockerfile
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
