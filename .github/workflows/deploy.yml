name: Deploy

# Main goes live by itself: once CI passes on a push to main, GitHub logs in to the server and runs deploy/ship.sh (pull,
# rebuild, prove it is live). The key it logs in with can do nothing else: the server's authorized_keys forces that one
# command for it, whatever is asked. The key and the server's host line are the repo's Actions secrets VPS_SSH_KEY and
# VPS_KNOWN_HOSTS. Nothing is checked out or built here, so no code from the repo runs with them.
#
# By hand: Actions → Deploy → Run workflow (on main). Migrations and settings stay by hand (deploy/migrate.sh, deploy/set-env.sh).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Read only: the migrations folder and deploy/LIVE_MIGRATION are checked out to be compared, nothing from them is run.
permissions:
  contents: read

# One deploy at a time, in order; a deploy under way is never cut off.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ship:
    # A run by hand on main, or a CI run that passed on a push to this repository's main (a fork's pull request from a branch
    # it named main never deploys).
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy
            tulmi/supabase/migrations

      # New code must not go live before the tables it uses: a migration in the repo newer than deploy/LIVE_MIGRATION (the last
      # one run on the database, written down once it has been) stops the deploy and says what to run. The code goes live with
      # that same command, and LIVE_MIGRATION is moved up after it.
      - name: Migrations are on the database
        run: |
          set -euo pipefail
          live="$(tr -dc '0-9' < deploy/LIVE_MIGRATION)"
          newer="$(ls tulmi/supabase/migrations | grep -oE '^[0-9]{4}' | sort -u | awk -v l="$live" '$1+0 > l+0' | tr '\n' ' ')"
          if [ -n "$newer" ]; then
            echo "::error::Migrations ${newer}are not on the database yet. Run on the server, from the repo: git pull --ff-only && ./deploy/migrate.sh ${newer}&& ./deploy/ship.sh"
            exit 1
          fi

      - name: Ship
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "Add VPS_SSH_KEY and VPS_KNOWN_HOSTS in Settings → Secrets and variables → Actions."; exit 1
          fi
          install -m 700 -d ~/.ssh
          umask 077
          # The key as it was pasted into the secret, put back whole: a paste can lose its line breaks (one long line), gain \r
          # (Windows) or spaces, or drop the BEGIN and END lines. ssh reads none of those ("error in libcrypto").
          if printf '%s' "$VPS_SSH_KEY" | grep -q '^ *ssh-ed25519 '; then
            echo "VPS_SSH_KEY holds the public key (ssh-ed25519 …). Paste the private one: from -----BEGIN OPENSSH PRIVATE KEY----- to -----END OPENSSH PRIVATE KEY-----."; exit 1
          fi
          body="$(printf '%s' "$VPS_SSH_KEY" | tr -d '\r' | sed -e 's/-----BEGIN OPENSSH PRIVATE KEY-----//g' -e 's/-----END OPENSSH PRIVATE KEY-----//g' | tr -d ' \t\n')"
          { echo "-----BEGIN OPENSSH PRIVATE KEY-----"; printf '%s\n' "$body" | fold -w 70; echo "-----END OPENSSH PRIVATE KEY-----"; } > ~/.ssh/deploy
          if ! ssh-keygen -y -f ~/.ssh/deploy > /dev/null 2>&1; then
            echo "VPS_SSH_KEY is not a whole private key ($(printf '%s' "$body" | wc -c) characters read)."
            echo "Paste everything the key command printed, from -----BEGIN OPENSSH PRIVATE KEY----- to -----END OPENSSH PRIVATE KEY-----."; exit 1
          fi
          # Its fingerprint (public, safe to show): the same as  ssh-keygen -lf ~/.ssh/github_deploy.pub  on the server.
          ssh-keygen -lf ~/.ssh/deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          ssh -T -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts -o ServerAliveInterval=30 root@91.108.104.168 ship
